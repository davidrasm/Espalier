[pytest]
addopts = -m "not slow"
python_files =
    test_empirical_reassortment_sim.py
    test_reassortment_mode.py
    test_flu_data.py
    test_flu_inference.py
    test_msprime_reassortment.py
    test_msprime_inference.py
markers =
    slow: slow-running inference and benchmark tests
    requires_raxml: tests that require the raxml-ng binary on PATH
    realdata: tests that exercise committed real-data fixtures
    simulation: tests that exercise msprime-based simulated fixtures
